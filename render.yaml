# Blueprint Render — déploiement en un clic de l'application Arbre de Vie
# (service web Node gratuit + base PostgreSQL gratuite, liés automatiquement).
services:
  - type: web
    name: arbre-de-vie
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true            # secret de session généré par Render
      - key: DATABASE_URL
        fromDatabase:
          name: arbre-de-vie-db
          property: connectionString

databases:
  - name: arbre-de-vie-db
    plan: free                         # PostgreSQL gratuit
