<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>ZAURA — Fiche membre</title>
  <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
  <style>
    :root {
      --primaire: #7c3aed;
      --primaire-fonce: #6d28d9;
      --vert: #16a34a;
      --rouge: #dc2626;
      --texte: #1e1b4b;
      --texte-doux: #6b7280;
      --bordure: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(165deg, #312e81 0%, #6366f1 30%, #a855f7 65%, #ec4899 100%);
      color: var(--texte);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .boite {
      background: rgba(255,255,255,.97); backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 28px 22px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 24px 60px rgba(49,46,129,.3);
    }
    .marque { text-align: center; margin-bottom: 4px; }
    .logo-z {
      display: inline-flex; align-items: center; justify-content: center;
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); color: #fff;
      font-weight: 900; font-size: 2.2rem;
    }
    .titre { text-align: center; font-size: 1.4rem; font-weight: 800; margin: 0 0 4px; background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .sous-titre { text-align: center; color: var(--texte-doux); font-size: .9rem; margin: 0 0 20px; }
    label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 4px; color: var(--texte); }
    input, select {
      width: 100%; padding: 12px; border: 1px solid var(--bordure);
      border-radius: 9px; font-size: 1rem; font-family: inherit;
      background: #fff; color: var(--texte); transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus { outline: none; border-color: var(--primaire); box-shadow: 0 0 0 3px rgba(124,58,237,.12); }
    .ligne { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .ligne { grid-template-columns: 1fr; } }
    .btn {
      display: block; width: 100%; margin-top: 20px; padding: 14px;
      border: none; border-radius: 9px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: box-shadow .15s, transform .1s;
    }
    .btn:hover { box-shadow: 0 4px 14px rgba(124,58,237,.3); }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .succes { text-align: center; padding: 40px 20px; }
    .succes .icone { font-size: 3rem; margin-bottom: 12px; }
    .succes h2 { color: var(--vert); margin: 0 0 8px; }
    .succes p { color: var(--texte-doux); }
    .erreur-msg { color: var(--rouge); font-size: .85rem; margin-top: 6px; }
    .chargement { text-align: center; padding: 40px; color: var(--texte-doux); }
  </style>
</head>
<body>
  <div class="boite" id="contenu">
    <div class="chargement">Chargement...</div>
  </div>

  <script>
    var slug = new URLSearchParams(window.location.search).get('slug') || '';

    function afficherFormulaire(orgNom, tribus, departements) {
      document.getElementById('contenu').innerHTML =
        '<div class="marque"><span class="logo-z">Z</span></div>' +
        '<div class="titre">' + esc(orgNom) + '</div>' +
        '<p class="sous-titre">Remplissez votre fiche pour rejoindre l\'assemblee</p>' +
        '<form id="form-fiche">' +
          '<div class="ligne">' +
            '<div><label>Prenom *</label><input name="prenom" required placeholder="Votre prenom"></div>' +
            '<div><label>Nom *</label><input name="nom" required placeholder="Votre nom de famille"></div>' +
          '</div>' +
          '<label>Telephone</label>' +
          '<input name="telephone" inputmode="tel" placeholder="+225 07 00 00 00 00">' +
          '<label>Tribu</label>' +
          '<select name="tribu">' +
            '<option value="">-- Choisir votre tribu --</option>' +
            tribus.map(function(t) { return '<option value="' + esc(t.nom) + '">' + esc(t.nom) + '</option>'; }).join('') +
          '</select>' +
          '<label>Departement</label>' +
          '<select name="departement">' +
            '<option value="">-- Choisir votre departement --</option>' +
            departements.map(function(d) { return '<option value="' + esc(d.nom) + '">' + esc(d.nom) + '</option>'; }).join('') +
          '</select>' +
          '<label>Adresse</label>' +
          '<input name="adresse" placeholder="Votre quartier ou adresse">' +
          '<label>Date de naissance</label>' +
          '<input type="date" name="date_naissance">' +
          '<div id="msg-erreur"></div>' +
          '<button class="btn" type="submit">Envoyer ma fiche</button>' +
        '</form>';

      document.getElementById('form-fiche').onsubmit = function(e) {
        e.preventDefault();
        var btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = 'Envoi en cours...';
        document.getElementById('msg-erreur').textContent = '';
        var donnees = Object.fromEntries(new FormData(e.target));
        donnees.slug = slug;
        fetch('/api/fiches', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(donnees)
        })
        .then(function(res) { return res.json().then(function(json) { return { ok: res.ok, json: json }; }); })
        .then(function(result) {
          if (!result.ok) throw new Error(result.json.error || 'Une erreur est survenue.');
          document.getElementById('contenu').innerHTML =
            '<div class="succes">' +
              '<div class="icone">&#10004;&#65039;</div>' +
              '<h2>Merci !</h2>' +
              '<p>' + result.json.message + '</p>' +
              '<p style="margin-top:20px;font-size:.85rem;color:#64748b;">Vous pouvez fermer cette page.</p>' +
            '</div>';
        })
        .catch(function(err) {
          document.getElementById('msg-erreur').innerHTML =
            '<p class="erreur-msg">' + err.message + '</p>';
          btn.disabled = false;
          btn.textContent = 'Envoyer ma fiche';
        });
      };
    }

    function esc(v) {
      return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    if (!slug) {
      document.getElementById('contenu').innerHTML =
        '<div class="succes"><div class="icone">&#9888;&#65039;</div>' +
        '<h2>Lien invalide</h2>' +
        '<p>Ce formulaire necessite un lien avec le code de l\'eglise (slug). ' +
        'Demandez un nouveau lien a votre pasteur.</p></div>';
    } else {
      Promise.all([
        fetch('/api/tribus?slug=' + encodeURIComponent(slug)).then(function(r) { return r.json(); }),
        fetch('/api/departements?slug=' + encodeURIComponent(slug)).then(function(r) { return r.json(); })
      ])
      .then(function(results) {
        var tribus = results[0].tribus || [];
        var departements = results[1].departements || [];
        var orgNom = results[0].organisation || 'Eglise';
        afficherFormulaire(orgNom, tribus, departements);
      })
      .catch(function() {
        document.getElementById('contenu').innerHTML =
          '<div class="succes"><div class="icone">&#9888;&#65039;</div>' +
          '<h2>Erreur</h2>' +
          '<p>Impossible de charger les informations de l\'eglise. Verifiez le lien et reessayez.</p></div>';
      });
    }
  </script>
</body>
</html>
