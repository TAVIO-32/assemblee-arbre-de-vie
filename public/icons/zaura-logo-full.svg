<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- Icon - circle -->
  <circle cx="65" cy="70" r="58" fill="url(#bg)"/>
  <circle cx="65" cy="70" r="51" fill="none" stroke="#fff" stroke-width="1" opacity="0.12"/>
  <!-- Z -->
  <path d="M38 42 L92 42 L38 98 L92 98" stroke="#fff" stroke-width="9.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Accent dot -->
  <circle cx="100" cy="32" r="5" fill="url(#accent)"/>
  <!-- Arc -->
  <path d="M48 108 Q65 118 82 108" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Text ZAURA -->
  <text x="140" y="88" font-family="'Avenir', 'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="6" fill="url(#txt)">ZAURA</text>

  <!-- Tagline -->
  <text x="143" y="112" font-family="'Avenir', 'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="6.5" fill="#94a3b8">GESTION D'EGLISE</text>
</svg>
